[pytest]
# Permite importar "utils" desde los tests sin problemas de rutas
pythonpath = .
testpaths = tests
markers =
    smoke: pruebas críticas y rápidas
    login: pruebas del flujo de autenticación
    catalogo: pruebas de navegación y verificación del inventario
    carrito: pruebas de interacción con el carrito

log_file = reports/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S